# Matches the live production service (Render name: Tickflow-Capital-Intelligence-Backend,
# slug: sentiment-driven-stock-price-prediction). If this file is applied as a
# Blueprint, the name must stay identical to the existing service.
services:
  - type: web
    name: Tickflow-Capital-Intelligence-Backend
    region: singapore
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in dashboard (Neon)

      # Redis (optional – fallback to LocMem)
      - key: REDIS_URL
        fromService:
          type: redis
          name: trading-redis
          property: connectionString

      # Django core
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: FRONTEND_URL
        value: "https://intelligence.tickflowcapital.com"
      - key: CONTACT_EMAIL
        value: "info@tickflowcapital.com"

      # Transactional email (Brevo HTTP API)
      - key: BREVO_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: DEFAULT_FROM_EMAIL
        value: "info@tickflowcapital.com"
      - key: DEFAULT_FROM_NAME
        value: "Tickflow Capital"

      # External APIs
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: "apidojo-yahoo-finance-v1.p.rapidapi.com"
      - key: TWELVEDATA_API_KEY
        sync: false

      # Cron secret (for the /stocks/cron/ endpoint)
      - key: CRON_SECRET
        sync: false  # Set a long random string

      # Database backups (S3-compatible object storage)
      - key: BACKUP_DATABASE_URL
        sync: false  # Neon direct (non-pooler) connection string for pg_dump
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: "backups/"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_S3_SERVER_SIDE_ENCRYPTION
        value: "AES256"
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Sentry
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: SENTRY_SEND_PII
        value: "false"
      - key: SENTRY_ENABLE_IN_DEBUG
        value: "false"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0.0"
      - key: SENTRY_ENABLE_PROFILING
        value: "false"

      # Logging
      - key: USE_JSON_LOGS
        value: "true"

      # Optional: Static API key fallback (if you want a fixed key)
      # - key: STATIC_API_KEY
      #   value: "your_static_key_here"  # Not recommended

    healthCheckPath: /api/v1/health/

  # Redis service (free tier)
  - type: redis
    name: trading-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction