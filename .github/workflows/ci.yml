name: CI

on:
  pull_request:
    branches:
      - master
      - staging
  push:
    branches:
      - master
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            sentiment_driven_stock_price_prediction_engine/requirements.txt
            sentiment_driven_stock_price_prediction_engine/requirements-ml.txt
            sentiment_driven_stock_price_prediction_engine/requirements-test.txt

      - name: Install backend dependencies
        working-directory: sentiment_driven_stock_price_prediction_engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ml.txt
          pip install -r requirements-test.txt

      - name: Run Django system checks
        working-directory: sentiment_driven_stock_price_prediction_engine
        env:
          SECRET_KEY: ci-only-not-a-secret
          DEBUG: 'true'
          SENTRY_DSN: ''
        run: python manage.py check

      - name: Check for missing Django migrations
        working-directory: sentiment_driven_stock_price_prediction_engine
        env:
          SECRET_KEY: ci-only-not-a-secret
          DEBUG: 'true'
          SENTRY_DSN: ''
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend test suite
        working-directory: sentiment_driven_stock_price_prediction_engine
        env:
          SECRET_KEY: ci-only-not-a-secret
          DEBUG: 'true'
          SENTRY_DSN: ''
        run: pytest -q

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend lint against the committed baseline
        run: npm run lint:ci

      - name: Run frontend tests
        run: npm run test -- --run

      - name: Build frontend
        run: npm run build
